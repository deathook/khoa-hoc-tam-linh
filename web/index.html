  <script>
    window.KHTL_TTS = {
      currentAudio: null,
      audioQueue: [],
      isAudioPlaying: false,
      isPaused: false,
      isStopped: true,
      currentSessionId: 0,
      keepAliveTimer: null,
      currentRate: 1.0,

      setRate: function(rate) {
        if (typeof rate === 'number' && rate > 0) {
          this.currentRate = rate;
          if (this.currentAudio) {
            try {
              this.currentAudio.defaultPlaybackRate = rate;
              this.currentAudio.playbackRate = rate;
            } catch(e) {}
          }
        }
      },

      getVoices: function() {
        if (!window.speechSynthesis) return [];
        var voices = window.speechSynthesis.getVoices();
        var list = [];
        for (var i = 0; i < voices.length; i++) {
          list.push({
            name: voices[i].name || '',
            lang: voices[i].lang || ''
          });
        }
        return list;
      },

      speak: function(text, isEnglish, rate, pitch, preferredVoiceName, onStart, onEnd, onError) {
        this.stop();
        if (!text || !text.trim()) {
          if (onEnd) onEnd();
          return;
        }

        var cleanText = text.trim();
        var targetLang = isEnglish ? 'en-US' : 'vi-VN';
        var effectiveRate = (typeof rate === 'number' && rate > 0) ? rate : (this.currentRate || 1.0);
        this.currentRate = effectiveRate;
        this.isStopped = false;
        this.isPaused = false;
        var sessionId = ++this.currentSessionId;
        var self = this;

        // Check for matching native voice in browser
        var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
        var selectedVoice = null;

        if (preferredVoiceName) {
          var pLower = preferredVoiceName.toLowerCase();
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].name && voices[i].name.toLowerCase() === pLower) {
              selectedVoice = voices[i];
              break;
            }
          }
        }

        if (!selectedVoice) {
          if (!isEnglish) {
            for (var i = 0; i < voices.length; i++) {
              var v = voices[i];
              var l = (v.lang || '').toLowerCase();
              var n = (v.name || '').toLowerCase();
              if (l.indexOf('vi') === 0 || l.indexOf('vi-') !== -1 || l.indexOf('vi_') !== -1 ||
                  n.indexOf('vietnam') !== -1 || n.indexOf('tiếng việt') !== -1 || n.indexOf('tieng viet') !== -1 ||
                  n.indexOf('hoaimy') !== -1 || n.indexOf('namminh') !== -1 || n.indexOf('an') !== -1) {
                selectedVoice = v;
                break;
              }
            }
          } else {
            for (var i = 0; i < voices.length; i++) {
              var l = (voices[i].lang || '').toLowerCase();
              if (l.indexOf('en') === 0) {
                selectedVoice = voices[i];
                break;
              }
            }
          }
        }

        // If a real matching native voice exists in browser, use SpeechSynthesis
        if (selectedVoice && (isEnglish || (!isEnglish && selectedVoice.lang.toLowerCase().indexOf('vi') === 0))) {
          var u = new SpeechSynthesisUtterance(cleanText);
          u.voice = selectedVoice;
          u.lang = selectedVoice.lang || targetLang;
          u.rate = effectiveRate;
          u.pitch = (typeof pitch === 'number' && pitch > 0) ? pitch : 1.0;

          u.onstart = function() {
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            if (onStart) onStart();

            // Safe Chrome keep-alive: ONLY call resume() if speaking, never pause()!
            if (self.keepAliveTimer) clearInterval(self.keepAliveTimer);
            self.keepAliveTimer = setInterval(function() {
              if (self.isStopped || self.currentSessionId !== sessionId) {
                clearInterval(self.keepAliveTimer);
                return;
              }
              if (window.speechSynthesis && window.speechSynthesis.speaking && !self.isPaused) {
                window.speechSynthesis.resume();
              }
            }, 5000);
          };

          u.onend = function() {
            if (self.keepAliveTimer) clearInterval(self.keepAliveTimer);
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            if (onEnd) onEnd();
          };

          u.onerror = function(e) {
            if (self.keepAliveTimer) clearInterval(self.keepAliveTimer);
            // If user stopped, paused, or changed session, do not trigger fallback!
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;

            self._playOnlineTts(cleanText, isEnglish, effectiveRate, onStart, onEnd, onError, sessionId);
          };

          try {
            window.speechSynthesis.speak(u);
          } catch(e) {
            self._playOnlineTts(cleanText, isEnglish, effectiveRate, onStart, onEnd, onError, sessionId);
          }
          return;
        }

        // Fallback to high quality online audio
        this._playOnlineTts(cleanText, isEnglish, effectiveRate, onStart, onEnd, onError, sessionId);
      },

      _splitTextIntoChunks: function(text, maxLength) {
        maxLength = maxLength || 160;
        if (text.length <= maxLength) return [text];

        var chunks = [];
        var sentences = text.split(/([.,!?;:\n]+)/);
        var cur = '';

        for (var i = 0; i < sentences.length; i++) {
          var part = sentences[i];
          if ((cur + part).length <= maxLength) {
            cur += part;
          } else {
            if (cur.trim().length > 0) chunks.push(cur.trim());
            cur = part;
          }
        }
        if (cur.trim().length > 0) chunks.push(cur.trim());
        return chunks.length > 0 ? chunks : [text.substring(0, maxLength)];
      },

      _playOnlineTts: function(text, isEnglish, rate, onStart, onEnd, onError, sessionId) {
        var self = this;
        if (self.isStopped || self.currentSessionId !== sessionId) return;

        var effectiveRate = (typeof rate === 'number' && rate > 0) ? rate : (this.currentRate || 1.0);
        this.currentRate = effectiveRate;
        var lang = isEnglish ? 'en' : 'vi';
        var chunks = this._splitTextIntoChunks(text, 160);
        this.audioQueue = [];

        for (var i = 0; i < chunks.length; i++) {
          var q = chunks[i];
          if (q.trim().length === 0) continue;
          this.audioQueue.push({
            proxyUrl: '/api/tts?tl=' + lang + '&q=' + encodeURIComponent(q),
            directUrl: 'https://translate.google.com/translate_tts?ie=UTF-8&tl=' + lang + '&client=tw-ob&q=' + encodeURIComponent(q)
          });
        }

        if (this.audioQueue.length === 0) {
          if (onEnd) onEnd();
          return;
        }

        var queueIdx = 0;
        var queue = this.audioQueue;
        var hasStarted = false;

        function playNext() {
          if (self.isStopped || self.currentSessionId !== sessionId) return;

          if (queueIdx >= queue.length) {
            self.isAudioPlaying = false;
            self.currentAudio = null;
            if (onEnd) onEnd();
            return;
          }

          var item = queue[queueIdx++];
          var audio = new Audio();
          audio.preload = 'auto';
          self.currentAudio = audio;
          self.isAudioPlaying = true;

          var applyRate = function() {
            var r = self.currentRate || effectiveRate;
            try {
              audio.defaultPlaybackRate = r;
              audio.playbackRate = r;
            } catch(e) {}
          };

          applyRate();

          audio.onplay = function() {
            if (self.isStopped || self.currentSessionId !== sessionId) {
              try { audio.pause(); audio.removeAttribute('src'); } catch(e){}
              return;
            }
            applyRate();
            if (!hasStarted) {
              hasStarted = true;
              if (onStart) onStart();
            }
          };

          audio.onended = function() {
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            playNext();
          };

          var triedDirect = false;
          audio.onerror = function() {
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            if (!triedDirect && item.directUrl) {
              triedDirect = true;
              audio.src = item.directUrl;
              applyRate();
              audio.play().catch(function() {
                if (self.isStopped || self.currentSessionId !== sessionId) return;
                playNext();
              });
            } else {
              playNext();
            }
          };

          audio.src = item.proxyUrl;
          applyRate();
          audio.play().catch(function(e) {
            if (self.isStopped || self.currentSessionId !== sessionId) return;
            if (!triedDirect && item.directUrl) {
              triedDirect = true;
              audio.src = item.directUrl;
              applyRate();
              audio.play().catch(function(err) {
                if (self.isStopped || self.currentSessionId !== sessionId) return;
                if (queueIdx >= queue.length && onError) {
                  onError(err ? err.message : 'autoplay-blocked');
                } else {
                  playNext();
                }
              });
            } else if (onError) {
              onError(e ? e.message : 'autoplay-blocked');
            }
          });
        }

        playNext();
      },

      pause: function() {
        this.isPaused = true;
        if (this.currentAudio) {
          try { this.currentAudio.pause(); } catch(e) {}
        } else if (window.speechSynthesis) {
          try { window.speechSynthesis.pause(); } catch(e) {}
        }
      },

      resume: function() {
        this.isPaused = false;
        if (this.currentAudio) {
          try { this.currentAudio.play().catch(function(){}); } catch(e) {}
        } else if (window.speechSynthesis) {
          try { window.speechSynthesis.resume(); } catch(e) {}
        }
      },

      stop: function() {
        this.isStopped = true;
        this.isPaused = false;
        this.currentSessionId = (this.currentSessionId || 0) + 1;
        if (this.keepAliveTimer) {
          clearInterval(this.keepAliveTimer);
          this.keepAliveTimer = null;
        }
        this.audioQueue = [];
        this.isAudioPlaying = false;
        if (this.currentAudio) {
          var a = this.currentAudio;
          this.currentAudio = null;
          try {
            a.pause();
            a.currentTime = 0;
            a.onplay = null;
            a.onended = null;
            a.onerror = null;
            a.removeAttribute('src');
            a.load();
          } catch(e) {}
        }
        if (window.speechSynthesis) {
          try {
            window.speechSynthesis.cancel();
          } catch(e) {}
        }
      }
    };

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = function() {
          window.speechSynthesis.getVoices();
        };
      }
    }
  </script>
