name: khoa_hoc_tam_linh
description: "Khoa Học Tâm Linh - Sách nói, đọc sách, podcast & thiền định song ngữ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  http: ^1.2.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
